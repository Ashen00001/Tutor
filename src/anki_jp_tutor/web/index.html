<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<meta name="theme-color" content="#07080c">
<meta name="color-scheme" content="dark">
<meta name="robots" content="noindex">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Tutor">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<title>Japanese Tutor</title>
<style>
:root {
  --bg: #07080c;
  --text: #f5f5f7;
  --muted: rgba(245, 245, 247, .56);
  --faint: rgba(245, 245, 247, .32);
  --glass: rgba(255, 255, 255, .055);
  --glass-2: rgba(255, 255, 255, .09);
  --line: rgba(255, 255, 255, .09);
  --ok: #34d399;
  --close: #fbbf24;
  --bad: #fb7185;
  --accent: #8b8cff;
  --font: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI Variable Display", "Segoe UI", system-ui, sans-serif;
  --font-ja: "Hiragino Sans", "Hiragino Kaku Gothic ProN", "Yu Gothic UI", "Yu Gothic", "Meiryo", "Noto Sans JP", system-ui, sans-serif;
  --r: 22px;
  --safe-t: env(safe-area-inset-top, 0px);
  --safe-b: env(safe-area-inset-bottom, 0px);
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { height: 100%; margin: 0; background: var(--bg); color: var(--text); font-family: var(--font); }
body { overflow: hidden; -webkit-font-smoothing: antialiased; }
button, input { font: inherit; color: inherit; }
button { cursor: pointer; border: 0; background: none; }
[hidden] { display: none !important; }
.ja { font-family: var(--font-ja); }

#app {
  height: 100dvh; display: flex; flex-direction: column;
  padding: calc(var(--safe-t) + 6px) 16px calc(var(--safe-b) + 12px);
  max-width: 640px; margin: 0 auto; position: relative;
}
body::before {
  content: ""; position: fixed; inset: 0; pointer-events: none;
  background: radial-gradient(60vmax 45vmax at 50% 28%, rgba(99, 102, 241, .13), transparent 70%),
              radial-gradient(40vmax 30vmax at 50% 100%, rgba(236, 72, 153, .06), transparent 70%);
}

/* top bar */
.top { display: flex; align-items: center; gap: 10px; height: 52px; position: relative; z-index: 2; }
.brand { font-weight: 600; letter-spacing: .02em; font-size: 17px; display: flex; align-items: center; gap: 8px; }
.brand .ja { font-weight: 600; }
.brand i { width: 8px; height: 8px; border-radius: 50%; background: linear-gradient(135deg, #22d3ee, #6366f1, #ec4899); box-shadow: 0 0 12px rgba(139, 140, 255, .8); }
.chips { display: flex; gap: 6px; margin-left: auto; }
.chip { font-size: 13px; color: var(--muted); padding: 5px 10px; border-radius: 999px; background: var(--glass); border: 1px solid var(--line); white-space: nowrap; font-variant-numeric: tabular-nums; }
.chip:empty { display: none; }
.icon-btn { width: 40px; height: 40px; border-radius: 50%; display: grid; place-items: center; background: var(--glass); border: 1px solid var(--line); transition: background .2s, transform .1s; }
.icon-btn:hover { background: var(--glass-2); }
.icon-btn:active { transform: scale(.94); }
.icon-btn svg { width: 19px; height: 19px; }
.icon-btn[aria-pressed="true"] { background: rgba(251, 113, 133, .16); border-color: rgba(251, 113, 133, .35); color: #fecdd3; }
.progress { position: absolute; left: 0; right: 0; bottom: -2px; height: 2px; background: rgba(255, 255, 255, .05); border-radius: 2px; overflow: hidden; }
.progress i { display: block; height: 100%; width: 0; background: linear-gradient(90deg, #22d3ee, #8b8cff, #ec4899); transition: width .5s cubic-bezier(.2, .8, .2, 1); }

/* stage */
main { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 0; position: relative; z-index: 1; padding-bottom: 4vh; }
body.compact main { justify-content: flex-start; padding-bottom: 0; }
.stage { display: flex; flex-direction: column; align-items: center; padding-top: clamp(4px, 3vh, 28px); flex-shrink: 0; }
.orb-btn { width: var(--orb, min(58vw, 32vh, 260px)); aspect-ratio: 1; border-radius: 50%; padding: 0; position: relative; outline: none; transition: transform .25s cubic-bezier(.2, .8, .2, 1), width .35s cubic-bezier(.2, .8, .2, 1); }
.orb-btn:active { transform: scale(.97); }
.orb-btn:focus-visible { box-shadow: 0 0 0 3px rgba(139, 140, 255, .6); }
.orb-btn canvas { width: 145%; height: 145%; position: absolute; left: -22.5%; top: -22.5%; pointer-events: none; }
body.compact .orb-btn { --orb: min(30vw, 18vh, 132px); }
body.compact .view { flex: 1 1 auto; }
.status { margin-top: 10px; font-size: 14px; color: var(--muted); min-height: 20px; letter-spacing: .01em; transition: opacity .2s; text-align: center; }

.view { width: 100%; flex: 0 1 auto; min-height: 0; overflow-y: auto; overscroll-behavior: contain; display: flex; flex-direction: column; align-items: center; padding: 8px 2px 12px; scrollbar-width: none; }
.view::-webkit-scrollbar { display: none; }
.enter { animation: rise .32s cubic-bezier(.2, .8, .2, 1) both; }
@keyframes rise { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }

.kicker { font-size: 13px; letter-spacing: .08em; text-transform: uppercase; color: var(--faint); margin-top: 6px; }
.prompt { font-size: clamp(44px, 13vw, 72px); line-height: 1.15; font-weight: 500; text-align: center; margin: 6px 0 2px; letter-spacing: .02em; word-break: keep-all; }
.prompt.en { font-family: var(--font); font-size: clamp(32px, 9vw, 48px); font-weight: 600; letter-spacing: -.01em; }
.sub { font-size: 20px; color: var(--muted); }
.hint { margin-top: 10px; font-size: 16px; color: var(--accent); background: rgba(139, 140, 255, .1); border: 1px solid rgba(139, 140, 255, .25); padding: 6px 12px; border-radius: 999px; }
.heard { margin-top: 14px; font-size: 18px; color: var(--muted); min-height: 26px; text-align: center; max-width: 90%; }
.heard b { color: var(--text); font-weight: 500; }

.welcome { text-align: center; margin-top: 8px; }
.welcome h1 { font-size: 30px; font-weight: 650; letter-spacing: -.02em; margin: 8px 0 6px; }
.welcome p { color: var(--muted); margin: 0; font-size: 16px; line-height: 1.5; }

/* cards */
.panel { width: 100%; background: var(--glass); border: 1px solid var(--line); border-radius: var(--r); padding: 18px; backdrop-filter: blur(24px) saturate(140%); -webkit-backdrop-filter: blur(24px) saturate(140%); }
.fb { margin-top: 6px; }
.verdict { display: flex; align-items: center; gap: 10px; }
.pill { font-size: 13px; font-weight: 600; padding: 5px 11px; border-radius: 999px; letter-spacing: .01em; }
.pill.correct { background: rgba(52, 211, 153, .14); color: var(--ok); }
.pill.close { background: rgba(251, 191, 36, .14); color: var(--close); }
.pill.wrong { background: rgba(251, 113, 133, .14); color: var(--bad); }
.verdict .line { color: var(--muted); font-size: 15px; }
.ans { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; margin-top: 14px; }
.ans .big { font-size: 34px; font-weight: 500; }
.ans .small { font-size: 18px; color: var(--muted); }
.ans .say { margin-left: auto; }
.mean { margin-top: 4px; font-size: 17px; }
.mean .ro { color: var(--muted); }
.tip { margin-top: 12px; font-size: 15px; line-height: 1.45; color: rgba(245, 245, 247, .82); }
.ex { margin-top: 12px; padding-top: 12px; border-top: 1px solid var(--line); }
.ex .jp { font-size: 20px; line-height: 1.9; }
.ex .en { color: var(--muted); font-size: 14px; }
ruby rt { font-size: .5em; color: var(--muted); }
.src { margin-top: 8px; font-size: 12px; color: var(--faint); }
.row { display: flex; gap: 10px; margin-top: 16px; }
.row > * { flex: 1; }

.btn { height: 48px; border-radius: 999px; font-weight: 600; font-size: 16px; padding: 0 20px; transition: transform .1s, background .2s, opacity .2s; display: inline-flex; align-items: center; justify-content: center; gap: 8px; }
.btn:active { transform: scale(.97); }
.btn.primary { background: #f5f5f7; color: #0b0c10; }
.btn.primary:hover { background: #fff; }
.btn.ghost { background: var(--glass); border: 1px solid var(--line); color: var(--text); }
.btn.ghost:hover { background: var(--glass-2); }
.btn.small { height: 38px; font-size: 14px; padding: 0 14px; font-weight: 500; }
.btn[disabled] { opacity: .45; pointer-events: none; }
.link { color: var(--muted); font-size: 14px; padding: 8px 10px; border-radius: 10px; }
.link:hover { color: var(--text); background: var(--glass); }

.speak { width: 34px; height: 34px; border-radius: 50%; display: grid; place-items: center; background: var(--glass-2); color: var(--muted); flex: none; }
.speak svg { width: 16px; height: 16px; }
.speak:hover { color: var(--text); }

.intro-grid { width: 100%; display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 10px; margin-top: 12px; }
.word { position: relative; background: var(--glass); border: 1px solid var(--line); border-radius: 20px; padding: 16px 16px 14px; text-align: left; transition: background .2s, transform .1s; }
.word:hover { background: var(--glass-2); }
.word:active { transform: scale(.98); }
.word .k { font-size: 32px; font-weight: 500; line-height: 1.2; }
.word .w { font-size: 15px; color: var(--muted); min-height: 18px; }
.word .m { font-size: 16px; font-weight: 600; margin-top: 8px; }
.word .r { font-size: 14px; color: var(--muted); }
.word .t { font-size: 13px; color: rgba(245, 245, 247, .7); margin-top: 8px; line-height: 1.4; }
.word .speak { position: absolute; top: 12px; right: 12px; }

.stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.stat { background: var(--glass); border: 1px solid var(--line); border-radius: 16px; padding: 12px; }
.stat b { display: block; font-size: 24px; font-weight: 650; font-variant-numeric: tabular-nums; }
.stat span { font-size: 12px; color: var(--muted); }

/* composer */
.composer { position: relative; z-index: 2; padding-top: 8px; }
.quick { display: flex; justify-content: center; gap: 4px; margin-bottom: 8px; }
.bar { display: flex; align-items: center; gap: 8px; background: rgba(255, 255, 255, .07); border: 1px solid var(--line); border-radius: 999px; padding: 6px 6px 6px 18px; transition: border-color .2s, background .2s; }
.bar:focus-within { border-color: rgba(139, 140, 255, .45); background: rgba(255, 255, 255, .09); }
.bar input { flex: 1; min-width: 0; background: none; border: 0; outline: none; font-size: 17px; height: 44px; }
.bar input::placeholder { color: var(--faint); }
.round { width: 44px; height: 44px; border-radius: 50%; display: grid; place-items: center; flex: none; transition: transform .1s, background .2s, opacity .2s; }
.round:active { transform: scale(.92); }
.round svg { width: 20px; height: 20px; }
.round.mic { background: var(--glass-2); }
.round.mic.on { background: linear-gradient(135deg, #22d3ee, #6366f1 55%, #ec4899); box-shadow: 0 0 22px rgba(139, 140, 255, .55); }
.round.send { background: #f5f5f7; color: #0b0c10; }
.round.send[disabled] { opacity: .25; }

/* sheet */
.scrim { position: fixed; inset: 0; background: rgba(0, 0, 0, .5); z-index: 10; opacity: 0; transition: opacity .25s; }
.scrim.open { opacity: 1; }
.sheet { position: fixed; left: 0; right: 0; bottom: 0; z-index: 11; margin: 0 auto; max-width: 640px; max-height: 86dvh; display: flex; flex-direction: column;
  background: rgba(22, 23, 30, .92); backdrop-filter: blur(30px) saturate(150%); -webkit-backdrop-filter: blur(30px) saturate(150%);
  border: 1px solid var(--line); border-bottom: 0; border-radius: 26px 26px 0 0; padding: 10px 16px calc(var(--safe-b) + 16px);
  transform: translateY(105%); transition: transform .32s cubic-bezier(.2, .8, .2, 1); }
.sheet.open { transform: none; }
.grab { width: 38px; height: 5px; border-radius: 3px; background: rgba(255, 255, 255, .18); margin: 0 auto 12px; }
.sheet h2 { font-size: 20px; margin: 0 0 12px; font-weight: 650; letter-spacing: -.01em; display: flex; align-items: center; }
.sheet h2 .x { margin-left: auto; }
.sheet .scroll { overflow-y: auto; min-height: 0; }
.toggle { display: flex; align-items: center; justify-content: space-between; padding: 14px 2px; border-bottom: 1px solid var(--line); font-size: 16px; }
.toggle small { display: block; color: var(--muted); font-size: 13px; margin-top: 2px; }
.switch { width: 50px; height: 30px; border-radius: 999px; background: rgba(255, 255, 255, .14); position: relative; transition: background .2s; flex: none; }
.switch::after { content: ""; position: absolute; top: 3px; left: 3px; width: 24px; height: 24px; border-radius: 50%; background: #fff; transition: transform .2s; }
.switch[aria-checked="true"] { background: #34c759; }
.switch[aria-checked="true"]::after { transform: translateX(20px); }
.menu-actions { display: grid; gap: 8px; margin-top: 16px; }

.chat { display: flex; flex-direction: column; gap: 8px; padding: 4px 0 12px; min-height: 120px; }
.msg { max-width: 84%; padding: 10px 14px; border-radius: 20px; font-size: 16px; line-height: 1.45; white-space: pre-wrap; }
.msg.user { align-self: flex-end; background: #f5f5f7; color: #0b0c10; border-bottom-right-radius: 6px; }
.msg.bot { align-self: flex-start; background: var(--glass-2); border-bottom-left-radius: 6px; }
.msg.bot.thinking { color: var(--muted); }
.msg .added { display: block; margin-top: 8px; font-size: 13px; color: var(--ok); }
.empty-note { color: var(--muted); font-size: 15px; line-height: 1.5; }
code { background: var(--glass-2); padding: 1px 6px; border-radius: 6px; font-size: .9em; }

.toast { position: fixed; left: 50%; top: calc(var(--safe-t) + 64px); transform: translate(-50%, -12px); z-index: 20; background: rgba(30, 31, 40, .92); border: 1px solid var(--line); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
  padding: 10px 16px; border-radius: 999px; font-size: 14px; opacity: 0; pointer-events: none; transition: opacity .25s, transform .25s; max-width: calc(100% - 32px); text-align: center; }
.toast.show { opacity: 1; transform: translate(-50%, 0); }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }

@media (min-width: 900px) and (min-height: 640px) {
  .prompt { font-size: 80px; }
  #app { padding-top: 16px; }
}
@media (max-height: 620px) {
  .orb-btn { --orb: min(40vw, 24vh, 160px); }
  .prompt { font-size: 44px; }
}
@media (prefers-reduced-motion: reduce) {
  .enter { animation: none; }
}
</style>
</head>
<body>
<div id="app">
  <header class="top">
    <div class="brand"><i></i><span class="ja">日本語</span></div>
    <div class="chips"><span id="leftChip" class="chip"></span><span id="streakChip" class="chip"></span></div>
    <button id="muteBtn" class="icon-btn" aria-label="Mute voice" aria-pressed="false" title="Mute (M)">
      <svg id="icoOn" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M11 5 6 9H3v6h3l5 4V5z"/><path d="M15.5 8.5a5 5 0 0 1 0 7"/><path d="M18.5 5.5a9 9 0 0 1 0 13"/></svg>
      <svg id="icoOff" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" hidden><path d="M11 5 6 9H3v6h3l5 4V5z"/><path d="m22 9-6 6"/><path d="m16 9 6 6"/></svg>
    </button>
    <button id="menuBtn" class="icon-btn" aria-label="Menu" title="Menu">
      <svg viewBox="0 0 24 24" fill="currentColor"><circle cx="5" cy="12" r="1.8"/><circle cx="12" cy="12" r="1.8"/><circle cx="19" cy="12" r="1.8"/></svg>
    </button>
    <div class="progress"><i id="bar"></i></div>
  </header>

  <main>
    <section class="stage">
      <button id="orbBtn" class="orb-btn" aria-label="Tap to start"><canvas id="orb"></canvas></button>
      <div id="status" class="status" aria-live="polite">Tap to start</div>
    </section>
    <section id="view" class="view"></section>
  </main>

  <footer id="composer" class="composer" hidden>
    <div class="quick">
      <button id="hintBtn" class="link" type="button">Hint</button>
      <button id="dunnoBtn" class="link" type="button">Don't know</button>
    </div>
    <form id="form" class="bar" autocomplete="off">
      <input id="input" type="text" placeholder="Type your answer" autocapitalize="off" autocorrect="off" spellcheck="false" enterkeyhint="send" aria-label="Your answer">
      <button id="micBtn" class="round mic" type="button" aria-label="Answer by voice" hidden>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="3" width="6" height="12" rx="3"/><path d="M5 11a7 7 0 0 0 14 0"/><path d="M12 18v3"/></svg>
      </button>
      <button id="sendBtn" class="round send" type="submit" aria-label="Send" disabled>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19V5"/><path d="m5 12 7-7 7 7"/></svg>
      </button>
    </form>
  </footer>
</div>

<div id="scrim" class="scrim" hidden></div>
<div id="sheet" class="sheet" role="dialog" aria-modal="true" aria-labelledby="sheetTitle" hidden></div>
<div id="toast" class="toast" role="status"></div>
<div id="live" class="sr" aria-live="assertive"></div>

<script>
"use strict";
const $ = (s, r = document) => r.querySelector(s);
const API = location.pathname.replace(/\/app\//, "/api/").replace(/\/+$/, "");
const sleep = ms => new Promise(r => setTimeout(r, ms));
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const store = {
  get(k, d) { try { const v = localStorage.getItem("jpt." + k); return v === null ? d : JSON.parse(v); } catch { return d; } },
  set(k, v) { try { localStorage.setItem("jpt." + k, JSON.stringify(v)); } catch {} },
};
const ICON_SPEAK = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M11 5 6 9H3v6h3l5 4V5z"/><path d="M15.5 8.5a5 5 0 0 1 0 7"/></svg>';

/* ------------------------------------------------------------------ orb */
const PAL = {
  base: ["#22d3ee", "#6366f1", "#ec4899", "#3b82f6"],
  correct: ["#34d399", "#22d3ee", "#a3e635", "#10b981"],
  wrong: ["#fb7185", "#f97316", "#ec4899", "#f43f5e"],
  listen: ["#22d3ee", "#818cf8", "#f0abfc", "#38bdf8"],
};
const rgb = h => [1, 3, 5].map(i => parseInt(h.slice(i, i + 2), 16));

class Orb {
  constructor(canvas) {
    this.c = canvas; this.x = canvas.getContext("2d");
    this.state = "idle"; this.level = 0; this.kickV = 0; this.t = 0; this.last = performance.now();
    this.pal = PAL.base.map(rgb); this.goal = PAL.base; this.flashUntil = 0;
    this.slow = matchMedia("(prefers-reduced-motion: reduce)").matches;
    new ResizeObserver(() => this.resize()).observe(canvas); this.resize();
    requestAnimationFrame(t => this.frame(t));
  }
  resize() {
    const d = Math.min(devicePixelRatio || 1, 2), r = this.c.getBoundingClientRect();
    this.c.width = Math.max(1, r.width * d); this.c.height = Math.max(1, r.height * d);
  }
  set(state) { this.state = state; }
  kick(v = .3) { this.kickV = Math.min(1, this.kickV + v); }
  flash(kind) { this.goal = PAL[kind] || PAL.base; this.flashUntil = performance.now() + 1300; }
  frame(now) {
    const dt = Math.min(.05, (now - this.last) / 1000); this.last = now;
    if (!document.hidden) {
      const speed = { idle: .55, listening: 1.3, speaking: 1.15, thinking: 2.6 }[this.state] ?? .55;
      this.t += dt * speed * (this.slow ? .35 : 1);
      const base = { idle: .05, listening: .2, speaking: .24, thinking: .14 }[this.state] ?? .05;
      let target = base + Math.sin(now / 1150) * .03 + this.kickV * .55;
      if (this.state === "speaking") target += (Math.sin(now / 95) * .5 + .5) * .1;
      if (this.state === "listening") target += (Math.sin(now / 170) * .5 + .5) * .06;
      this.level += (target - this.level) * .14; this.kickV *= .9;
      if (now > this.flashUntil) this.goal = this.state === "listening" ? PAL.listen : PAL.base;
      const g = this.goal.map(rgb);
      this.pal = this.pal.map((c, i) => c.map((v, j) => v + (g[i][j] - v) * .07));
      this.draw();
    }
    requestAnimationFrame(t => this.frame(t));
  }
  draw() {
    const { x, c, pal, level, t } = this, w = c.width, h = c.height, cx = w / 2, cy = h / 2;
    const R = Math.min(w, h) * .345 * (1 + level * .16);
    const col = (i, a) => `rgba(${pal[i].map(Math.round).join(",")},${a})`;
    x.clearRect(0, 0, w, h);
    const glow = x.createRadialGradient(cx, cy, R * .55, cx, cy, R * 1.45);
    glow.addColorStop(0, col(1, .32 + level * .45)); glow.addColorStop(.55, col(2, .08 + level * .12)); glow.addColorStop(1, "rgba(0,0,0,0)");
    x.fillStyle = glow; x.fillRect(0, 0, w, h);
    x.save(); x.beginPath(); x.arc(cx, cy, R, 0, Math.PI * 2); x.clip();
    x.fillStyle = "#06070b"; x.fillRect(cx - R, cy - R, R * 2, R * 2);
    x.globalCompositeOperation = "lighter";
    for (let i = 0; i < 4; i++) {
      const a = t * (.7 + i * .27) + i * 1.9, spread = R * (.3 + level * .3);
      const bx = cx + Math.cos(a) * spread, by = cy + Math.sin(a * 1.17 + i) * spread;
      const rr = R * (.62 + .14 * Math.sin(t * 1.4 + i * 2.1));
      const g = x.createRadialGradient(bx, by, 0, bx, by, rr);
      g.addColorStop(0, col(i, .95)); g.addColorStop(.45, col(i, .45)); g.addColorStop(1, col(i, 0));
      x.fillStyle = g; x.fillRect(cx - R, cy - R, R * 2, R * 2);
    }
    x.globalCompositeOperation = "source-over";
    const hl = x.createRadialGradient(cx - R * .38, cy - R * .48, 0, cx - R * .38, cy - R * .48, R * .9);
    hl.addColorStop(0, "rgba(255,255,255,.28)"); hl.addColorStop(1, "rgba(255,255,255,0)");
    x.fillStyle = hl; x.fillRect(cx - R, cy - R, R * 2, R * 2);
    const edge = x.createRadialGradient(cx, cy, R * .78, cx, cy, R);
    edge.addColorStop(0, "rgba(0,0,0,0)"); edge.addColorStop(1, "rgba(0,0,0,.45)");
    x.fillStyle = edge; x.fillRect(cx - R, cy - R, R * 2, R * 2);
    x.restore();
    x.beginPath(); x.arc(cx, cy, R - .5, 0, Math.PI * 2);
    x.strokeStyle = "rgba(255,255,255,.10)"; x.lineWidth = Math.max(1, R * .012); x.stroke();
  }
}
const orb = new Orb($("#orb"));

/* ------------------------------------------------------------ voice out */
const JA_RUN = /[぀-ヿ㐀-鿿ｦ-ﾟ々〆ー]+(?:[、。！？!?\s]*[぀-ヿ㐀-鿿ｦ-ﾟ々〆ー]+)*[。！？]?/g;
function splitLangs(text) {
  const out = []; let pos = 0;
  for (const m of text.matchAll(JA_RUN)) {
    if (m.index > pos) out.push({ t: text.slice(pos, m.index), lang: "en" });
    out.push({ t: m[0], lang: "ja" }); pos = m.index + m[0].length;
  }
  if (pos < text.length) out.push({ t: text.slice(pos), lang: "en" });
  return out.filter(s => s.t.replace(/[\s().,;:!?"'-]/g, ""));
}
const TTS = {
  ok: "speechSynthesis" in window,
  muted: store.get("muted", false),
  voices: [], gen: 0, done: null,
  init() {
    if (!this.ok) return;
    const load = () => { this.voices = speechSynthesis.getVoices(); };
    load(); speechSynthesis.onvoiceschanged = load;
  },
  pick(lang) {
    const want = lang === "ja" ? "ja" : "en";
    const vs = this.voices.filter(v => v.lang.toLowerCase().replace("_", "-").startsWith(want));
    const prefs = lang === "ja"
      ? [/Nanami.*Natural/i, /Natural/i, /Google 日本語/, /Kyoko|O-ren|Otoya|Hattori/i, /Haruka|Ayumi|Sayaka|Ichiro/i]
      : [/(Aria|Jenny|Ava|Andrew|Emma).*Natural/i, /Natural/i, /Google US English/i, /Samantha|Ava|Allison|Zira/i];
    for (const p of prefs) { const v = vs.find(v => p.test(v.name) && (want === "ja" || /en-US/i.test(v.lang) || /Natural/i.test(v.name))); if (v) return v; }
    return vs.find(v => /(ja-JP|en-US)/i.test(v.lang.replace("_", "-"))) || vs[0] || null;
  },
  unlock() { if (this.ok) { const u = new SpeechSynthesisUtterance(" "); u.volume = 0; speechSynthesis.speak(u); } },
  stop() { this.gen++; if (this.ok) speechSynthesis.cancel(); if (this.done) { const d = this.done; this.done = null; d(); } },
  speak(segs) {
    this.stop();
    if (!segs || !segs.length) return Promise.resolve();
    if (this.muted || !this.ok) { orb.kick(.35); return Promise.resolve(); }
    const gen = this.gen;
    return new Promise(resolve => {
      this.done = resolve;
      let i = 0;
      const finish = () => { if (this.done === resolve) this.done = null; if (gen === this.gen) setOrbIdle(); resolve(); };
      const next = () => {
        if (gen !== this.gen) return resolve();
        if (i >= segs.length) return finish();
        const s = segs[i++];
        const u = new SpeechSynthesisUtterance(s.t);
        u.lang = s.lang === "ja" ? "ja-JP" : "en-US";
        const v = this.pick(s.lang); if (v) u.voice = v;
        u.rate = s.lang === "ja" ? .92 : 1.06;
        let moved = false;
        const go = () => { if (!moved) { moved = true; clearTimeout(guard); next(); } };
        const guard = setTimeout(go, Math.max(2200, s.t.length * (s.lang === "ja" ? 260 : 95) + 1200));
        u.onstart = () => orb.kick(.4);
        u.onboundary = () => orb.kick(.28);
        u.onend = go; u.onerror = go;
        orb.set("speaking");
        speechSynthesis.speak(u);
      };
      next();
    });
  },
};
TTS.init();

/* ------------------------------------------------------------- voice in */
const STT = {
  Rec: window.JPT_DEMO ? null : (window.SpeechRecognition || window.webkitSpeechRecognition),
  rec: null,
  get ok() { return !!this.Rec; },
  get on() { return !!this.rec; },
  listen(lang, onInterim) {
    return new Promise((resolve, reject) => {
      const r = new this.Rec();
      r.lang = lang; r.interimResults = true; r.maxAlternatives = 3; r.continuous = false;
      let final = "", alts = [];
      r.onresult = e => {
        let txt = "";
        for (const res of e.results) {
          txt += res[0].transcript;
          if (res.isFinal) { final = txt; alts = Array.from(res).map(a => a.transcript); }
        }
        onInterim(txt); orb.kick(.22);
      };
      r.onspeechstart = () => orb.kick(.5);
      r.onerror = e => { this.rec = null; if (["no-speech", "aborted"].includes(e.error)) resolve(null); else reject(e.error); };
      r.onend = () => { this.rec = null; resolve(final.trim() ? { text: final.trim(), alts } : null); };
      this.rec = r;
      try { r.start(); } catch (err) { this.rec = null; reject(err); }
    });
  },
  stop() { try { this.rec?.stop(); } catch {} },
};

/* ------------------------------------------------------------------ api */
async function api(path, body) {
  if (window.JPT_DEMO) return window.JPT_DEMO(path, body);  // offline demo build only
  const opt = body === undefined ? {} : { method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify(body) };
  const r = await fetch(API + path, opt);
  const j = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(j.error || `Server error ${r.status}`);
  return j;
}

/* ----------------------------------------------------------------- flow */
async function start() {
  if (S.started) return;
  S.started = true; TTS.unlock();
  orb.set("thinking"); setStatus("Getting your words…");
  try {
    const [cfg, d] = await Promise.all([api("/config").catch(() => ({})), api("/start", {})]);
    S.ask.enabled = !!cfg.ask; S.stats = d.stats; S.done = 0;
    orb.set("idle");
    $("#orbBtn").setAttribute("aria-label", "Tap to talk");
    if (d.unlocked) toast(`Unlocked 3 new starter words`);
    show(d.item);
  } catch (e) {
    S.started = false; orb.set("idle"); setStatus("Tap to retry"); toast(e.message || "Couldn't reach the server", 3500);
  }
}

function show(item) {
  S.item = item; S.fbToken++;
  if (!item || item.kind === "none") { S.started = false; return start(); }
  if (item.kind === "intro") return renderIntro(item);
  if (item.kind === "quiz") return renderQuiz(item);
  return renderEmpty();
}

async function submit(text, alts = [], gaveUp = false) {
  if (S.phase !== "quiz" || !S.card || S.busy) return;
  S.busy = true; STT.stop(); TTS.stop();
  const card = S.card, token = ++S.fbToken;
  orb.set("thinking");
  let c;
  try {
    c = await api("/check", { card_id: card.card_id, text, alts, hinted: S.hinted, gave_up: gaveUp });
  } catch (e) { S.busy = false; orb.set("idle"); toast(e.message); return; }
  S.busy = false;
  if (c.verdict === "retry") {
    orb.set("idle"); const h = $("#heard"); if (h) h.innerHTML = `<b>${esc(text)}</b> · ${esc(c.line)}`;
    showComposer(true); TTS.speak(c.speech); return;
  }
  S.phase = "feedback"; showComposer(false); compact(true);
  orb.flash(c.verdict === "wrong" ? "wrong" : "correct"); orb.kick(.6);
  setView(feedbackHTML(c, gaveUp ? "" : text));
  say(`${c.line} ${jp(c.card)}, ${c.card.romaji}, ${c.card.meaning}`);
  setStatus(c.verdict === "correct" ? "" : "Tap Next when you're ready");
  $("#sayAns").onclick = () => TTS.speak([{ t: jp(c.card), lang: "ja" }]);

  if (c.verdict === "correct") {
    const saved = commit(card.card_id, c.result);
    const spoken = TTS.speak(c.speech).then(() => sleep(TTS.muted ? 650 : 200));
    let skip = false;
    $("#nextBtn").onclick = () => { skip = true; TTS.stop(); };
    await Promise.race([spoken, new Promise(r => { const b = $("#nextBtn"); b.addEventListener("click", r, { once: true }); })]);
    const d = await saved; if (!d || token !== S.fbToken) return;
    advance(d, skip);
  } else {
    TTS.speak(c.speech);
    const go = async result => {
      $("#nextBtn").disabled = true; const rb = $("#rightBtn"); if (rb) rb.disabled = true;
      TTS.stop(); const d = await commit(card.card_id, result); if (d && token === S.fbToken) advance(d, true);
    };
    $("#nextBtn").onclick = () => go(c.result);
    $("#rightBtn").onclick = () => { toast("Counted as right 👍"); go("good"); };
  }
}

async function commit(cardId, result) {
  try {
    const d = await api("/answer", { card_id: cardId, result });
    S.done++; return d;
  } catch (e) { toast(e.message); S.phase = "quiz"; return null; }
}

async function advance(d, quiet) {
  if (d.hype && !quiet) { toast(d.hype); await TTS.speak([{ t: d.hype, lang: "en" }]); }
  else if (d.hype) toast(d.hype);
  show(d.next);
}

async function listen() {
  if (!STT.ok || S.phase !== "quiz" || !S.card) return;
  if (STT.on) { STT.stop(); return; }
  TTS.stop();
  const lang = S.card.direction === "production" ? "ja-JP" : "en-US";
  const heard = $("#heard");
  orb.set("listening"); $("#micBtn").classList.add("on");
  setStatus(lang === "ja-JP" ? "Listening… (Japanese)" : "Listening…");
  try {
    const r = await STT.listen(lang, t => { if (heard) heard.innerHTML = `<b>${esc(t)}</b>`; });
    $("#micBtn").classList.remove("on"); orb.set("idle");
    if (!r) { setStatus("Didn't catch that. Tap to try again"); return; }
    submit(r.text, r.alts);
  } catch (e) {
    $("#micBtn").classList.remove("on"); orb.set("idle");
    setStatus("Type your answer");
    toast(e === "not-allowed" || e === "service-not-allowed" ? "Mic is blocked. Allow it in the browser, or just type." : `Voice input error: ${e}`, 3500);
  }
}

function hint() {
  if (S.phase !== "quiz" || !S.card) return;
  const v = S.card, h = $("#hint"); S.hinted = true;
  h.textContent = v.direction === "recognition"
    ? `${v.romaji} · starts with “${first(v.meaning)[0]}”`
    : `${jp(v)[0]}… (${v.romaji.slice(0, 2)}…)`;
  h.hidden = false;
}

}

function openAsk() {
  if (!S.ask.enabled) {
    openSheet(`<h2 id="sheetTitle">Ask the tutor ${X_BTN}</h2><p class="empty-note">Ask mode uses Claude Haiku (fast, cheap) to answer questions and turn anime lines into cards. Turn it on by adding <code>ANTHROPIC_API_KEY=…</code> to the server's <code>.env</code> and running <code>docker compose up -d</code>.<br><br>Until then, you can ask in the Claude app with the Japanese Tutor connector on.</p>`);
    return;
  }
  openSheet(`<h2 id="sheetTitle">Ask the tutor ${X_BTN}</h2>
    <div class="scroll" id="chatScroll"><div class="chat" id="chat">${S.ask.history.length ? "" : `<div class="empty-note">Ask anything (“why is it を not は?”) or paste a line from a show and I'll save the useful words.</div>`}</div></div>
    <form id="askForm" class="bar"><input id="askInput" placeholder="Ask or paste a line" autocomplete="off" enterkeyhint="send" aria-label="Ask the tutor">
      <button id="askMic" class="round mic" type="button" aria-label="Ask by voice" ${STT.ok ? "" : "hidden"}><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="3" width="6" height="12" rx="3"/><path d="M5 11a7 7 0 0 0 14 0"/><path d="M12 18v3"/></svg></button>
      <button class="round send" type="submit" aria-label="Send"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19V5"/><path d="m5 12 7-7 7 7"/></svg></button></form>`);
  const chat = $("#chat");
  for (const m of S.ask.history) chat.insertAdjacentHTML("beforeend", `<div class="msg ${m.role === "user" ? "user" : "bot"}">${esc(m.content)}</div>`);
  const scroll = () => { const s = $("#chatScroll"); s.scrollTop = s.scrollHeight; };
  scroll();
  const send = async text => {
    text = text.trim(); if (!text) return;
    $("#askInput").value = "";
    chat.querySelector(".empty-note")?.remove();
    S.ask.history.push({ role: "user", content: text });
    chat.insertAdjacentHTML("beforeend", `<div class="msg user">${esc(text)}</div><div class="msg bot thinking" id="pending">…</div>`); scroll();
    orb.set("thinking");
    try {
      const d = await api("/ask", { messages: S.ask.history.slice(-10), card_id: S.card?.card_id });
      S.ask.history.push({ role: "assistant", content: d.reply });
      const p = $("#pending"); p.classList.remove("thinking"); p.removeAttribute("id");
      p.innerHTML = esc(d.reply) + (d.added?.length ? `<span class="added">Saved: ${d.added.map(esc).join("、")} <button class="btn small ghost" id="quizNew" style="margin-left:6px">Quiz me</button></span>` : "");
      if (d.item) $("#quizNew")?.addEventListener("click", () => { closeSheet(); show(d.item); });
      scroll(); orb.set("idle");
      TTS.speak(splitLangs(d.reply));
    } catch (e) { $("#pending")?.remove(); orb.set("idle"); toast(e.message, 3500); }
  };
  $("#askForm").onsubmit = e => { e.preventDefault(); send($("#askInput").value); };
  $("#askMic").onclick = async () => {
    if (STT.on) return STT.stop();
    TTS.stop(); $("#askMic").classList.add("on"); orb.set("listening");
    try { const r = await STT.listen("en-US", t => $("#askInput").value = t); if (r) send(r.text); }
    catch (e) { toast(`Voice input error: ${e}`); }
    finally { $("#askMic")?.classList.remove("on"); orb.set("idle"); }
  };
}

/* ---------------------------------------------------------------- wiring */
function setMuted(m) {
  TTS.muted = m; store.set("muted", m);
  $("#muteBtn").setAttribute("aria-pressed", m); $("#muteBtn").setAttribute("aria-label", m ? "Unmute voice" : "Mute voice");
  $("#icoOn").hidden = m; $("#icoOff").hidden = !m;
  if (m) TTS.stop();
}
$("#muteBtn").onclick = () => { setMuted(!TTS.muted); toast(TTS.muted ? "Voice off" : "Voice on", 1200); };
$("#menuBtn").onclick = openMenu;
$("#orbBtn").onclick = () => {
  if (!S.started && S.phase !== "summary") return start();
  if (S.phase === "summary") { S.started = false; return start(); }
  if (S.phase === "quiz") return STT.ok ? listen() : $("#input").focus();
  if (S.phase === "feedback") return $("#nextBtn")?.click();
  if (S.phase === "intro") return $("#goQuiz")?.click();
  if (S.phase === "empty") return moreWords();
};
$("#micBtn").onclick = listen;
$("#hintBtn").onclick = hint;
$("#dunnoBtn").onclick = () => submit("", [], true);
$("#input").addEventListener("input", e => { $("#sendBtn").disabled = !e.target.value.trim(); });
$("#form").onsubmit = e => { e.preventDefault(); const v = $("#input").value.trim(); if (v) submit(v); };
document.addEventListener("keydown", e => {
  const typing = e.target.matches("input, textarea");
  if (e.key === "Escape") return closeSheet();
  if (!$("#sheet").hidden) return;
  if (!typing && (e.key === "m" || e.key === "M")) { e.preventDefault(); $("#muteBtn").click(); }
  if (e.key === "Enter" && !typing && (S.phase === "feedback" || S.phase === "intro")) { e.preventDefault(); $("#orbBtn").click(); }
  if (e.key === " " && !typing && S.phase !== "welcome") { e.preventDefault(); $("#orbBtn").click(); }
});
document.addEventListener("visibilitychange", () => { if (document.hidden) { TTS.stop(); STT.stop(); } });

setMuted(TTS.muted);
renderWelcome();
if ("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(() => {});
</script>
</body>
</html>
